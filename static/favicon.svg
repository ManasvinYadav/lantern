<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2.4 32 32" width="32" height="32" role="img" aria-label="Lantern">
  <!-- Lantern: a light inside a housing. Slate housing, emerald light.
       Deliberately not the red/amber of the flame icon this replaced — on a
       status dashboard a red tab icon reads as "something is down" at a
       glance, and amber is the DEGRADED colour. The slate silhouette carries
       the mark on a light tab strip, the emerald glass on a dark one.
       viewBox y is offset so the mark sits centred in the square. -->
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="15.8" r="10" fill="url(#lanternGlow)"/>
  <path d="M12.2 5.6a3.8 3.8 0 0 1 7.6 0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <rect x="7.5" y="5.4" width="17" height="3.6" rx="1.8" fill="#64748b"/>
  <path d="M10.8 8.8h10.4l2.3 13H8.5Z" fill="#64748b"/>
  <path d="M12.4 11.4h7.2l2 8.8H10.4Z" fill="#10b981"/>
  <g transform="translate(11.56 11.86) scale(.37)">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="#ecfdf5"/>
  </g>
  <rect x="6.6" y="21.6" width="18.8" height="3.6" rx="1.8" fill="#64748b"/>
</svg>
