<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lantern">
  <!-- The favicon mark on Lantern's canvas colour. Content stays inside the
       maskable safe zone (a circle of r=205 about the centre), so Android can
       crop this to any shape without clipping the lantern. Housing is a step
       lighter than the favicon's, which needs to survive a white tab strip;
       here it only ever sits on #0d1117. -->
  <defs>
    <radialGradient id="lanternGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0d1117"/>
  <circle cx="256" cy="270" r="152" fill="url(#lanternGlow512)"/>
  <g transform="translate(64 94) scale(12)">
    <path d="M12.2 5.6a3.8 3.8 0 0 1 7.6 0" fill="none" stroke="#8fa0b8" stroke-width="2" stroke-linecap="round"/>
    <rect x="7.5" y="5.4" width="17" height="3.6" rx="1.8" fill="#8fa0b8"/>
    <path d="M10.8 8.8h10.4l2.3 13H8.5Z" fill="#8fa0b8"/>
    <path d="M12.4 11.4h7.2l2 8.8H10.4Z" fill="#10b981"/>
    <g transform="translate(11.56 11.86) scale(.37)">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="#ecfdf5"/>
    </g>
    <rect x="6.6" y="21.6" width="18.8" height="3.6" rx="1.8" fill="#8fa0b8"/>
  </g>
</svg>
