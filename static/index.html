<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔆 Lantern — Service Dashboard</title>
  <style>
    /* =====================================================================
       CSS Custom Properties (Design Tokens)
       ===================================================================== */
    
/* Themes */
:root, [data-theme="dark"] {
  --bg: #0f1117; --bg-card: #1a1d27; --bg-card-hover: #1f2235;
  --bg-input: #12151f; --border: #2a2d3e; --border-focus: #4c5280;
  --text-primary: #e8eaf0; --text-secondary: #8b90a8; --text-muted: #555a72;
  --up-bg: #1a2e22; --up-text: #4ade80; --up-border: #4ade80; --up-glow: rgba(74, 222, 128, 0.15);
  --down-bg: #2d1a1a; --down-text: #f87171; --down-border: #f87171; --down-glow: rgba(248, 113, 113, 0.15);
  --degraded-bg: #2d2614; --degraded-text: #fbbf24; --degraded-border: #fbbf24; --degraded-glow: rgba(251, 191, 36, 0.15);
  --unknown-bg: #1f2235; --unknown-text: #94a3b8; --unknown-border: #4c5280; --unknown-glow: rgba(148, 163, 184, 0.1);
}

[data-theme="light"] {
  --bg: #f5f7fa; --bg-card: #ffffff; --bg-card-hover: #f0f2f8;
  --bg-input: #eef0f5; --border: #d1d5e0; --border-focus: #6366f1;
  --text-primary: #1a1d2e; --text-secondary: #4b5380; --text-muted: #9099b8;
  --up-bg: #dcfce7; --up-text: #16a34a; --up-border: #86efac; --up-glow: rgba(22,163,74,0.15);
  --down-bg: #fee2e2; --down-text: #dc2626; --down-border: #fca5a5; --down-glow: rgba(220,38,38,0.15);
  --degraded-bg: #fef9c3; --degraded-text: #ca8a04; --degraded-border: #fde047; --degraded-glow: rgba(202,138,4,0.15);
  --unknown-bg: #f1f5f9; --unknown-text: #64748b; --unknown-border: #cbd5e1; --unknown-glow: rgba(100,116,139,0.1);
}

[data-theme="tokyo-night"] {
  --bg: #1a1b26; --bg-card: #24283b; --bg-card-hover: #2a2e42;
  --bg-input: #1f2335; --border: #3b4261; --border-focus: #7aa2f7;
  --text-primary: #c0caf5; --text-secondary: #9aa5ce; --text-muted: #565f89;
  --up-bg: #1a2632; --up-text: #9ece6a; --up-border: #41a6b5; --up-glow: rgba(158,206,106,0.15);
  --down-bg: #2d1a1a; --down-text: #f7768e; --down-border: #f7768e; --down-glow: rgba(247,118,142,0.15);
  --degraded-bg: #2d2200; --degraded-text: #e0af68; --degraded-border: #e0af68; --degraded-glow: rgba(224,175,104,0.15);
  --unknown-bg: #1f2335; --unknown-text: #565f89; --unknown-border: #3b4261; --unknown-glow: rgba(86,95,137,0.1);
}

[data-theme="catppuccin"] {
  --bg: #1e1e2e; --bg-card: #313244; --bg-card-hover: #3d3f54;
  --bg-input: #181825; --border: #45475a; --border-focus: #cba6f7;
  --text-primary: #cdd6f4; --text-secondary: #a6adc8; --text-muted: #6c7086;
  --up-bg: #1e2a1e; --up-text: #a6e3a1; --up-border: #a6e3a1; --up-glow: rgba(166,227,161,0.15);
  --down-bg: #2d1e1e; --down-text: #f38ba8; --down-border: #f38ba8; --down-glow: rgba(243,139,168,0.15);
  --degraded-bg: #2d2510; --degraded-text: #fab387; --degraded-border: #fab387; --degraded-glow: rgba(250,179,135,0.15);
  --unknown-bg: #313244; --unknown-text: #6c7086; --unknown-border: #45475a; --unknown-glow: rgba(108,112,134,0.1);
}

[data-theme="nord"] {
  --bg: #2e3440; --bg-card: #3b4252; --bg-card-hover: #434c5e;
  --bg-input: #292e3b; --border: #4c566a; --border-focus: #88c0d0;
  --text-primary: #eceff4; --text-secondary: #d8dee9; --text-muted: #4c566a;
  --up-bg: #2a3f3f; --up-text: #a3be8c; --up-border: #a3be8c; --up-glow: rgba(163,190,140,0.15);
  --down-bg: #3f2a2a; --down-text: #bf616a; --down-border: #bf616a; --down-glow: rgba(191,97,106,0.15);
  --degraded-bg: #3f3520; --degraded-text: #ebcb8b; --degraded-border: #ebcb8b; --degraded-glow: rgba(235,203,139,0.15);
  --unknown-bg: #3b4252; --unknown-text: #4c566a; --unknown-border: #4c566a; --unknown-glow: rgba(76,86,106,0.1);
}


    /* =====================================================================
       Reset & Base
       ===================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    /* =====================================================================
       Layout
       ===================================================================== */
    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* =====================================================================
       Header
       ===================================================================== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .last-updated {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Loading indicator */
    .loading-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      margin-right: 8px;
      transition: background 0.3s;
    }
    .loading-dot.active {
      background: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.7);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      color: var(--text-primary);
    }
    .btn:active { transform: scale(0.97); }

    /* =====================================================================
       Section headings
       ===================================================================== */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* =====================================================================
       Status Badge
       ===================================================================== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge.up       { background: var(--up-bg);       color: var(--up-text);       border: 1px solid var(--up-border); }
    .badge.down     { background: var(--down-bg);     color: var(--down-text);     border: 1px solid var(--down-border); }
    .badge.degraded { background: var(--degraded-bg); color: var(--degraded-text); border: 1px solid var(--degraded-border); }
    .badge.unknown  { background: var(--unknown-bg);  color: var(--unknown-text);  border: 1px solid var(--unknown-border); }

    /* =====================================================================
       Services Grid
       ===================================================================== */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 48px;
    }

    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .service-card::before {
      /* Accent line on the left */
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 3px;
      border-radius: 0 3px 3px 0;
    }
    .service-card.up::before    { background: var(--up-text); }
    .service-card.down::before  { background: var(--down-text); }
    .service-card.degraded::before { background: var(--degraded-text); }
    .service-card.unknown::before  { background: var(--unknown-text); }

    .service-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
    .service-card.up:hover     { border-color: var(--up-border);       box-shadow: 0 0 0 1px var(--up-border),    0 8px 24px var(--up-glow); }
    .service-card.down:hover   { border-color: var(--down-border);     box-shadow: 0 0 0 1px var(--down-border),  0 8px 24px var(--down-glow); }
    .service-card.degraded:hover { border-color: var(--degraded-border); box-shadow: 0 0 0 1px var(--degraded-border), 0 8px 24px var(--degraded-glow); }
    .service-card.unknown:hover  { border-color: var(--unknown-border);  box-shadow: 0 0 0 1px var(--unknown-border),  0 8px 24px var(--unknown-glow); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-all;
      padding-right: 8px;
    }

    .card-message {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      min-height: 18px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .card-footer {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state-text { font-size: 14px; }

    /* =====================================================================
       Modal (service detail)
       ===================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.hidden { display: none; }

    .modal-panel {
      width: 560px;
      max-width: 100vw;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      animation: slideIn 0.2s ease;
      box-shadow: -8px 0 40px rgba(0,0,0,0.5);
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title-group { display: flex; flex-direction: column; gap: 6px; }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .modal-close {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .modal-close:hover { background: var(--bg-card-hover); color: var(--text-primary); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }
    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* =====================================================================
       History Table
       ===================================================================== */
    .history-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 9px 12px;
      vertical-align: middle;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 13px;
    }

    tr:last-child td { border-bottom: none; }

    tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tbody tr:hover { background: rgba(255,255,255,0.04); }

    .ts-cell {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .msg-cell {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================================
       Diagnostics Section
       ===================================================================== */
    .diag-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .diag-filter-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus { border-color: var(--border-focus); }

    .diag-list { display: flex; flex-direction: column; gap: 2px; }

    .diag-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .diag-row:hover { border-color: var(--border-focus); }
    .diag-row.expanded { border-color: var(--border-focus); }

    .diag-summary {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      user-select: none;
    }

    .diag-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .diag-service { font-size: 12px; }

    .diag-ts {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .diag-chevron {
      color: var(--text-muted);
      font-size: 12px;
      transition: transform 0.2s;
    }
    .diag-row.expanded .diag-chevron { transform: rotate(180deg); }

    .diag-content-wrap {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }
    .diag-row.expanded .diag-content-wrap { display: block; }

    .diag-content-loading {
      padding: 16px 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    .diag-content-pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 420px;
      overflow-y: auto;
      margin-top: 12px;
      line-height: 1.7;
    }
    .diag-content-pre::-webkit-scrollbar { width: 6px; }
    .diag-content-pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* =====================================================================
       Error / Notice banners
       ===================================================================== */
    .notice {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      border: 1px solid;
      margin-bottom: 14px;
    }
    .notice.error { background: var(--down-bg); border-color: var(--down-border); color: var(--down-text); }

    /* =====================================================================
       Responsive
       ===================================================================== */

    /* Additional UI Styles */
    .controls-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; justify-content: space-between; }
    .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-pill {
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer;
      background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .filter-pill:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .filter-pill.active { background: var(--border-focus); color: #fff; border-color: var(--border-focus); }
    
    .status-strip-container { display: flex; height: 24px; gap: 2px; margin-top: 12px; border-radius: 4px; overflow: hidden; background: var(--bg-input); }
    .status-block { flex: 1; min-width: 0; }
    .status-block.up { background: var(--up-border); }
    .status-block.down { background: var(--down-border); }
    .status-block.degraded { background: var(--degraded-border); }
    .status-block.unknown { background: var(--unknown-border); }
    
    .stale-badge { font-size: 14px; margin-left: 6px; cursor: help; }
    
    /* Graph */
    .graph-tabs { display: flex; gap: 10px; margin-bottom: 12px; }
    .graph-tab { cursor: pointer; padding: 4px 10px; font-size: 12px; border-radius: var(--radius-sm); color: var(--text-secondary); }
    .graph-tab.active { background: var(--bg-input); color: var(--text-primary); font-weight: bold; }
    
    .svg-container { position: relative; width: 100%; height: 160px; background: var(--bg-input); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 20px; }
    .svg-container svg { width: 100%; height: 100%; }
    .graph-tooltip { position: absolute; background: var(--bg-card); border: 1px solid var(--border); padding: 4px 8px; font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.2s; color: var(--text-primary); border-radius: 4px; z-index: 10; }
    
    .incident-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .incident-item { padding: 10px; background: var(--bg-input); border-left: 3px solid var(--down-border); border-radius: 4px; font-size: 12px; }
    
    .maintenance-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 13px; }
    
    /* Tooltip text */
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary);
      padding: 4px 8px; font-size: 11px; border-radius: 4px; white-space: nowrap; z-index: 10;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      .modal-panel { width: 100vw; }
      .diag-summary { grid-template-columns: 1fr auto; }
      .diag-service, .diag-ts { display: none; }
      .services-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .services-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    }
  </style>

    <script>
        const savedTheme = localStorage.getItem('lantern_theme') || 'dark';
    window.addEventListener('DOMContentLoaded', () => {
      const ts = document.getElementById('themeSwitcher');
      if(ts) {
        ts.value = savedTheme;
        ts.addEventListener('change', (e) => {
          const t = e.target.value;
          document.documentElement.setAttribute('data-theme', t);
          localStorage.setItem('lantern_theme', t);
        });
      }
    });
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

</head>
<body>
  <div class="app">

    <!-- ================================================================
         Header
         ================================================================ -->
    <header class="header">
      <div class="header-left">
        <div>
          <div class="header-title">🔆 Lantern</div>
          <div class="header-subtitle">Self-hosted service health dashboard</div>
        </div>
      </div>
      <div class="header-meta">
        <select id="themeSwitcher" class="btn" style="margin-right: 10px;">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="tokyo-night">Tokyo Night</option>
          <option value="catppuccin">Catppuccin Mocha</option>
          <option value="nord">Nord</option>
        </select>
        <span class="loading-dot" id="loadingDot"></span>
        <span class="last-updated" id="lastUpdated">Loading…</span>
        <button class="btn" id="refreshBtn" title="Refresh now">
          ↻ Refresh
        </button>
      </div>
    </header>

    <!-- ================================================================
         Services Section
         ================================================================ -->
    <section>
      <div class="section-header">
        <h2 class="section-title">Services</h2>
        <span class="section-count" id="serviceCount">—</span>
      </div>
      
      <div class="controls-bar">
        <div class="filter-pills" id="serviceFilters">
          <div class="filter-pill active" data-filter="all">All</div>
          <div class="filter-pill" data-filter="down">Down</div>
          <div class="filter-pill" data-filter="degraded">Degraded</div>
          <div class="filter-pill" data-filter="stale">Stale</div>
          <div class="filter-pill" data-filter="maintenance">Maintenance</div>
        </div>
        <select id="sortServices" class="btn">
          <option value="name">Sort by Name</option>
          <option value="status">Sort by Status</option>
          <option value="last_seen">Sort by Last Seen</option>
        </select>
      </div>
      
      <div id="servicesError"></div>
      <div class="services-grid" id="servicesGrid">
        <!-- Cards injected by JS -->
      </div>
    </section>

    <!-- ================================================================
         Diagnostics Section
         ================================================================ -->
    <section>
      <div class="section-header">
        <h2 class="section-title">Diagnostic Runs</h2>
        <span class="section-count" id="diagCount">—</span>
      </div>
      <div class="diag-controls">
        <span class="diag-filter-label">Filter by service:</span>
        <select id="diagFilter">
          <option value="">All services</option>
        </select>
      </div>
      <div id="diagError"></div>
      <div class="diag-list" id="diagList">
        <!-- Rows injected by JS -->
      </div>
    </section>

  </div><!-- /.app -->

  <!-- ================================================================
       Service Detail Modal (slide-in drawer)
       ================================================================ -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-title" id="modalTitle">Service</span>
          <span id="modalBadge"></span>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="maintenance-toggle">
          <label>Maintenance Mode:</label>
          <button id="maintenanceBtn" class="btn">Toggle</button>
          <span id="maintenanceStatus"></span>
        </div>
        
        <div class="history-label">Uptime Graph</div>
        <div class="graph-tabs" id="graphTabs">
          <div class="graph-tab active" data-range="24h">24h</div>
          <div class="graph-tab" data-range="7d">7d</div>
          <div class="graph-tab" data-range="30d">30d</div>
        </div>
        <div class="svg-container" id="svgContainer">
          <div class="graph-tooltip" id="graphTooltip"></div>
          <svg id="uptimeSvg"></svg>
        </div>
        
        <div class="history-label">Incidents</div>
        <div class="incident-list" id="incidentList">Loading...</div>

        <div class="history-label">Event History</div>
        <div id="historyError"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Status</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="3" style="color:var(--text-muted);text-align:center;padding:24px">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==================================================================
       Constants & State
       ================================================================== */
    const API = {
      services:    '/api/services',
      history:     (name) => `/api/services/${encodeURIComponent(name)}/history?limit=50`,
      diagnostics: '/api/diagnostics',
      diagnostic:  (id)   => `/api/diagnostics/${id}`,
    };

    const REFRESH_INTERVAL_MS = 30_000;

    let state = {
      services:    [],
      diagnostics: [],
      diagFilter:  '',
      refreshTimer: null,
      serviceFilter: 'all',
      serviceSort: 'name',
      activeModalService: null,
      graphRange: '24h',
      strips: {}
    };
    
    // Add event listeners for filter and sort
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('#serviceFilters .filter-pill').forEach(el => {
        el.addEventListener('click', (e) => {
          document.querySelectorAll('#serviceFilters .filter-pill').forEach(p => p.classList.remove('active'));
          e.target.classList.add('active');
          state.serviceFilter = e.target.dataset.filter;
          renderServices();
        });
      });
      document.getElementById('sortServices').addEventListener('change', (e) => {
        state.serviceSort = e.target.value;
        renderServices();
      });
      document.querySelectorAll('.graph-tab').forEach(el => {
        el.addEventListener('click', (e) => {
          document.querySelectorAll('.graph-tab').forEach(p => p.classList.remove('active'));
          e.target.classList.add('active');
          state.graphRange = e.target.dataset.range;
          if(state.activeModalService) loadModalData(state.activeModalService);
        });
      });
      document.getElementById('maintenanceBtn').addEventListener('click', async () => {
        if(!state.activeModalService) return;
        const current = document.getElementById('maintenanceStatus').innerText === 'Enabled';
        const res = await fetch(`/api/services/${encodeURIComponent(state.activeModalService)}/maintenance`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({enabled: !current, note: 'Toggled via UI'})
        });
        if(res.ok) {
           const data = await res.json();
           document.getElementById('maintenanceStatus').innerText = data.enabled ? 'Enabled' : 'Disabled';
           loadAll(); // refresh data in background
        }
      });
    });


    /* ==================================================================
       Utility helpers
       ================================================================== */

    /** Return a human-readable relative time string (e.g. "3m ago"). */
    function relativeTime(isoString) {
      if (!isoString) return '—';
      const diffMs = Date.now() - new Date(isoString).getTime();
      const s = Math.floor(diffMs / 1000);
      if (s < 5)   return 'just now';
      if (s < 60)  return `${s}s ago`;
      const m = Math.floor(s / 60);
      if (m < 60)  return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24)  return `${h}h ago`;
      const d = Math.floor(h / 24);
      return `${d}d ago`;
    }

    /** Format an ISO datetime string for compact display. */
    function formatTS(isoString) {
      if (!isoString) return '—';
      const d = new Date(isoString);
      return d.toLocaleString(undefined, {
        month: '2-digit', day: '2-digit',
        hour: '2-digit',  minute: '2-digit', second: '2-digit',
        hour12: false,
      });
    }

    /** Build a status badge element. */
    function makeBadge(status) {
      const span = document.createElement('span');
      span.className = `badge ${status || 'unknown'}`;
      span.textContent = status || 'unknown';
      return span;
    }

    /** Show a loading dot animation. */
    function setLoading(active) {
      document.getElementById('loadingDot').classList.toggle('active', active);
    }

    /** Render an inline error notice. */
    function renderError(containerId, msg) {
      const el = document.getElementById(containerId);
      if (msg) {
        el.innerHTML = `<div class="notice error">⚠ ${msg}</div>`;
      } else {
        el.innerHTML = '';
      }
    }

    /* ==================================================================
       Data fetching
       ================================================================== */

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status} from ${url}`);
      return res.json();
    }

    async function loadServices() {
      try {
        state.services = await fetchJSON(API.services);
        renderError('servicesError', '');
        renderServices();
        populateDiagFilter();
      } catch (err) {
        console.error('loadServices:', err);
        renderError('servicesError', `Could not load services: ${err.message}`);
      }
    }

    async function loadDiagnostics() {
      const url = state.diagFilter
        ? `${API.diagnostics}?service_name=${encodeURIComponent(state.diagFilter)}&limit=50`
        : `${API.diagnostics}?limit=50`;
      try {
        state.diagnostics = await fetchJSON(url);
        renderError('diagError', '');
        renderDiagnostics();
      } catch (err) {
        console.error('loadDiagnostics:', err);
        renderError('diagError', `Could not load diagnostics: ${err.message}`);
      }
    }

    async function loadAll() {
      setLoading(true);
      await Promise.all([loadServices(), loadDiagnostics()]);
      setLoading(false);
      document.getElementById('lastUpdated').textContent =
        `Last updated: ${new Date().toLocaleTimeString()}`;
    }

    /* ==================================================================
       Services rendering
       ================================================================== */

    function renderServices() {
      const grid = document.getElementById('servicesGrid');
      const count = document.getElementById('serviceCount');
      let services = [...(state.services || [])];
      
      // Filter
      if(state.serviceFilter !== 'all') {
         services = services.filter(s => {
           if(state.serviceFilter === 'down') return s.status === 'down';
           if(state.serviceFilter === 'degraded') return s.status === 'degraded';
           if(state.serviceFilter === 'stale') return s.stale;
           if(state.serviceFilter === 'maintenance') return s.maintenance;
           return true;
         });
      }
      
      // Sort
      services.sort((a, b) => {
         if(state.serviceSort === 'name') return a.service_name.localeCompare(b.service_name);
         if(state.serviceSort === 'status') {
            const map = {down: 0, degraded: 1, up: 2, unknown: 3};
            const va = map[a.status] ?? 4;
            const vb = map[b.status] ?? 4;
            if(va !== vb) return va - vb;
            return a.service_name.localeCompare(b.service_name);
         }
         if(state.serviceSort === 'last_seen') {
            const ta = new Date(a.last_seen).getTime();
            const tb = new Date(b.last_seen).getTime();
            return tb - ta;
         }
         return 0;
      });

      count.textContent = `${services.length} service${services.length !== 1 ? 's' : ''}`;

      if (services.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📡</div>
            <div class="empty-state-text">No services reporting yet (or none match filter).</div>
          </div>`;
        return;
      }

      grid.innerHTML = '';
      for (const svc of services) {
        const card = document.createElement('div');
        card.className = `service-card ${svc.status || 'unknown'}`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        
        let staleHTML = svc.stale ? `<span class="stale-badge" title="Stale: No recent data">⏰</span>` : '';
        let uptimeHTML = svc.uptime_7d != null ? `<span style="font-size:11px; float:right; color:var(--text-muted);">${svc.uptime_7d}% (7d)</span>` : '';
        let maintHTML = svc.maintenance ? `<span class="badge unknown" style="margin-left: 5px;">Maint</span>` : '';
        
        let stripHTML = `<div class="status-strip-container" id="strip-${svc.service_name}"></div>`;
        
        card.innerHTML = `
          <div class="card-top">
            <div class="card-name">${escapeHtml(svc.service_name)}${staleHTML}</div>
            ${uptimeHTML}
          </div>
          <div style="margin-bottom:10px"></div>
          <div class="card-message">${escapeHtml(svc.message || 'No message')}</div>
          ${stripHTML}
          <div class="card-footer" style="margin-top: 10px;">${relativeTime(svc.timestamp)}</div>`;

        // Insert badge after card-name
        const cardTop = card.querySelector('.card-top');
        cardTop.insertBefore(makeBadge(svc.status), cardTop.childNodes[1]);
        if (svc.maintenance) {
          cardTop.insertBefore(makeBadge('Maint'), cardTop.childNodes[2]);
        }

        card.addEventListener('click',  () => openModal(svc));
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') openModal(svc); });

        grid.appendChild(card);
        
        // render strip
        if(state.strips[svc.service_name]) {
           renderStrip(svc.service_name, state.strips[svc.service_name]);
        } else {
           fetchJSON(`/api/services/${encodeURIComponent(svc.service_name)}/strip`).then(data => {
              state.strips[svc.service_name] = data.buckets;
              renderStrip(svc.service_name, data.buckets);
           }).catch(err => console.error(err));
        }
      }
    }
    
    function renderStrip(serviceName, buckets) {
       const container = document.getElementById(`strip-${serviceName}`);
       if(!container) return;
       container.innerHTML = buckets.map(b => `<div class="status-block ${b.status}" title="${new Date(b.start).toLocaleString()} - ${b.status}"></div>`).join('');
    }


    /** Populate the diagnostics filter dropdown with known service names. */
    function populateDiagFilter() {
      const sel = document.getElementById('diagFilter');
      const current = sel.value;
      // Keep the "All services" option
      sel.innerHTML = '<option value="">All services</option>';
      const names = [...new Set(state.services.map(s => s.service_name))].sort();
      for (const name of names) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        if (name === current) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    /* ==================================================================
       Service detail modal
       ================================================================== */

    function openModal(svc) {
      state.activeModalService = svc.service_name;
      document.getElementById('modalTitle').textContent = svc.service_name;
      const badgeEl = document.getElementById('modalBadge');
      badgeEl.innerHTML = '';
      badgeEl.appendChild(makeBadge(svc.status));
      if (svc.maintenance) badgeEl.appendChild(makeBadge('Maint'));

      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      // Reset all views
      document.getElementById('historyBody').innerHTML = `<tr><td colspan="3" style="color:var(--text-muted);text-align:center;padding:24px">Loading…</td></tr>`;
      document.getElementById('incidentList').innerHTML = 'Loading...';
      document.getElementById('uptimeSvg').innerHTML = '';
      document.getElementById('maintenanceStatus').innerText = 'Loading...';
      renderError('historyError', '');

      loadModalData(svc.service_name);
    }
    
    async function loadModalData(name) {
       loadHistory(name);
       
       // Load Maintenance
       fetchJSON(`/api/services/${encodeURIComponent(name)}/maintenance`).then(data => {
          document.getElementById('maintenanceStatus').innerText = data.enabled ? 'Enabled' : 'Disabled';
       }).catch(err => { document.getElementById('maintenanceStatus').innerText = 'Error'; });
       
       // Load Graph
       fetchJSON(`/api/services/${encodeURIComponent(name)}/uptime?range=${state.graphRange}`).then(data => {
          renderGraph(data.datapoints);
       }).catch(err => { document.getElementById('uptimeSvg').innerHTML = ''; });
       
       // Load Incidents
       fetchJSON(`/api/services/${encodeURIComponent(name)}/incidents?range=${state.graphRange}`).then(data => {
          renderIncidents(data.incidents);
       }).catch(err => { document.getElementById('incidentList').innerHTML = 'Error loading incidents'; });
    }
    
    function renderIncidents(incidents) {
       const list = document.getElementById('incidentList');
       if(!incidents || incidents.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted); font-size:12px;">No incidents in this timeframe.</div>';
          return;
       }
       list.innerHTML = incidents.map(inc => `
          <div class="incident-item">
             <div><strong>${inc.trigger_status.toUpperCase()}</strong>: ${escapeHtml(inc.trigger_message)}</div>
             <div style="color:var(--text-muted); margin-top:4px;">${formatTS(inc.started_at)} to ${inc.ended_at ? formatTS(inc.ended_at) : 'Ongoing'} (${inc.duration_minutes}m)</div>
          </div>
       `).join('');
    }
    
    function renderGraph(datapoints) {
       const svg = document.getElementById('uptimeSvg');
       if(!datapoints || datapoints.length === 0) {
           svg.innerHTML = ''; return;
       }
       const w = svg.parentElement.clientWidth || 500;
       const h = 160;
       svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
       
       const maxVal = 100;
       const pts = datapoints.map((dp, i) => {
           const x = (i / (datapoints.length - 1)) * w;
           const y = h - (dp.uptime_pct / 100 * h);
           return {x, y, dp};
       });
       
       let pathD = `M ${pts[0].x} ${pts[0].y}`;
       pts.forEach(p => pathD += ` L ${p.x} ${p.y}`);
       
       let areaD = pathD + ` L ${w} ${h} L 0 ${h} Z`;
       
       svg.innerHTML = `
         <defs>
           <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
             <stop offset="0%" stop-color="var(--up-border)" stop-opacity="0.4" />
             <stop offset="100%" stop-color="var(--up-border)" stop-opacity="0" />
           </linearGradient>
         </defs>
         <path d="${areaD}" fill="url(#areaGrad)" />
         <path d="${pathD}" fill="none" stroke="var(--up-border)" stroke-width="2" />
       `;
       
       // Add interactive circles
       const tooltip = document.getElementById('graphTooltip');
       pts.forEach(p => {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', p.x);
          circle.setAttribute('cy', p.y);
          circle.setAttribute('r', '4');
          circle.setAttribute('fill', 'var(--up-border)');
          circle.style.opacity = '0';
          circle.style.cursor = 'pointer';
          
          circle.addEventListener('mouseenter', (e) => {
             circle.style.opacity = '1';
             tooltip.innerText = `${formatTS(p.dp.timestamp)}
Uptime: ${p.dp.uptime_pct}%`;
             tooltip.style.opacity = '1';
             tooltip.style.left = `${Math.min(e.offsetX, w - 100)}px`;
             tooltip.style.top = `${Math.max(e.offsetY - 30, 0)}px`;
          });
          circle.addEventListener('mouseleave', () => {
             circle.style.opacity = '0';
             tooltip.style.opacity = '0';
          });
          svg.appendChild(circle);
       });
    }


    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.body.style.overflow = '';
    }

    async function loadHistory(serviceName) {
      try {
        const data = await fetchJSON(API.history(serviceName));
        renderHistory(data.events || []);
      } catch (err) {
        console.error('loadHistory:', err);
        renderError('historyError', `Could not load history: ${err.message}`);
        document.getElementById('historyBody').innerHTML = '';
      }
    }

    function renderHistory(events) {
      const tbody = document.getElementById('historyBody');
      if (!events.length) {
        tbody.innerHTML = `<tr><td colspan="3" style="color:var(--text-muted);text-align:center;padding:24px">No events found.</td></tr>`;
        return;
      }
      tbody.innerHTML = events.map(e => `
        <tr>
          <td class="ts-cell">${formatTS(e.timestamp)}</td>
          <td>${makeBadge(e.status).outerHTML}</td>
          <td class="msg-cell" title="${escapeHtml(e.message || '')}">${escapeHtml(e.message || '—')}</td>
        </tr>`).join('');
    }

    // Modal close handlers
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* ==================================================================
       Diagnostics rendering
       ================================================================== */

    function renderDiagnostics() {
      const list  = document.getElementById('diagList');
      const count = document.getElementById('diagCount');
      const runs  = state.diagnostics || [];

      count.textContent = `${runs.length} run${runs.length !== 1 ? 's' : ''}`;

      if (runs.length === 0) {
        list.innerHTML = `
          <div class="empty-state" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg)">
            <div class="empty-state-icon">🩺</div>
            <div class="empty-state-text">No diagnostic runs yet.</div>
          </div>`;
        return;
      }

      list.innerHTML = '';
      for (const run of runs) {
        const row = document.createElement('div');
        row.className = 'diag-row';
        row.dataset.id = run.id;

        row.innerHTML = `
          <div class="diag-summary">
            <span class="diag-title">${escapeHtml(run.title)}</span>
            <span class="diag-service">${makeBadge('unknown').outerHTML.replace('unknown', '').replace('badge unknown', 'badge unknown').replace('<span', '<span').replace('</span>', '</span>')}<span class="badge unknown" style="font-size:10px;padding:2px 8px">${escapeHtml(run.service_name)}</span></span>
            <span class="diag-ts">${formatTS(run.timestamp)}</span>
            <span class="diag-chevron">▼</span>
          </div>
          <div class="diag-content-wrap">
            <div class="diag-content-loading" id="diagContent-${run.id}">Loading…</div>
          </div>`;

        row.querySelector('.diag-summary').addEventListener('click', () => toggleDiag(row, run.id));
        list.appendChild(row);
      }
    }

    const diagCache = {};

    async function toggleDiag(row, id) {
      const isExpanded = row.classList.contains('expanded');
      // Collapse all others
      document.querySelectorAll('.diag-row.expanded').forEach(r => r.classList.remove('expanded'));

      if (isExpanded) return; // was open, now closed — done.

      row.classList.add('expanded');
      const contentEl = document.getElementById(`diagContent-${id}`);

      if (diagCache[id]) {
        renderDiagContent(contentEl, diagCache[id]);
        return;
      }

      contentEl.textContent = 'Loading…';
      try {
        const data = await fetchJSON(API.diagnostic(id));
        diagCache[id] = data.content;
        renderDiagContent(contentEl, data.content);
      } catch (err) {
        contentEl.textContent = `Error: ${err.message}`;
      }
    }

    function renderDiagContent(el, content) {
      el.outerHTML; // access before replacement
      const pre = document.createElement('pre');
      pre.className = 'diag-content-pre';
      pre.textContent = content;
      el.replaceWith(pre);
    }

    // Diagnostics filter
    document.getElementById('diagFilter').addEventListener('change', (e) => {
      state.diagFilter = e.target.value;
      loadDiagnostics();
    });

    /* ==================================================================
       Auto-refresh
       ================================================================== */

    function scheduleRefresh() {
      clearTimeout(state.refreshTimer);
      state.refreshTimer = setTimeout(async () => {
        await loadAll();
        scheduleRefresh();
      }, REFRESH_INTERVAL_MS);
    }

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      clearTimeout(state.refreshTimer);
      await loadAll();
      scheduleRefresh();
    });

    /* ==================================================================
       XSS-safe HTML escaping
       ================================================================== */
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ==================================================================
       Bootstrap
       ================================================================== */
    (async () => {
      await loadAll();
      scheduleRefresh();
    })();
  </script>
</body>
</html>
