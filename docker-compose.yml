services:
  lantern:
    image: lantern:latest
    build: .
    container_name: lantern
    restart: unless-stopped
    ports:
      - "${LANTERN_PORT:-7654}:7654"
    volumes:
      - lantern_data:/data
    environment:
      # Port the service listens on inside the container
      - LANTERN_PORT=7654
      # Data retention period in days (default: 30)
      - LANTERN_RETENTION_DAYS=${LANTERN_RETENTION_DAYS:-30}
      # Optional basic auth — uncomment and set to enable:
      # - LANTERN_AUTH_USER=admin
      # - LANTERN_AUTH_PASS=changeme
      - LANTERN_DB_PATH=/data/lantern.db
      # Hours before a service is marked 'stale' if no update received (default: 24)
      - LANTERN_STALE_HOURS=${LANTERN_STALE_HOURS:-24}
      # Optional Discord/Slack/generic webhook URL for status change alerts:
      # - LANTERN_WEBHOOK_URL=https://discord.com/api/webhooks/...
      # Demo mode — seeds fake data if DB is empty (set to 'true' to enable):
      # - LANTERN_DEMO=false

volumes:
  lantern_data:
