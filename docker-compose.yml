services:
  lantern:
    build: .
    image: lantern:latest
    container_name: lantern
    restart: unless-stopped
    ports:
      - "${LANTERN_PORT:-7654}:7654"
    volumes:
      - lantern_data:/data
      # Docker socket: required for native container discovery and for the
      # dashboard's container inspect/logs/restart actions.
      # NOTE: :ro applies to the mount point, not to the Docker API. The
      # daemon still accepts write operations over this socket, so this is
      # a convention, not a security boundary.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Port the service listens on inside the container
      - LANTERN_PORT=7654
      # Data retention period in days (default: 30)
      - LANTERN_RETENTION_DAYS=${LANTERN_RETENTION_DAYS:-30}
      # Sign-in credentials. Seeded into the database on FIRST BOOT ONLY; after
      # that the stored row wins, so a password changed in the dashboard is not
      # reverted by a stale value here. You can also leave these unset and turn
      # sign-in on from Settings -> Account & Security.
      # - LANTERN_AUTH_USER=admin
      # - LANTERN_AUTH_PASS=change-me-at-least-8-chars
      # API Bearer Token for scripts and CI. Gates writes, Docker controls,
      # /api/backup and GET /api/webhooks, but shows no login wall.
      # Read from .env (gitignored). Empty when unset, which is the same as
      # not configuring it. With stored admin credentials present the login
      # gate still applies to every non-exempt route -- authRequired() is
      # checked before the token in authMiddleware -- so this only adds a
      # credential that scripts can send, it does not open anything up.
      - LANTERN_AUTH_TOKEN=${LANTERN_AUTH_TOKEN:-}
      # Path to SQLite DB inside the container
      - LANTERN_DB_PATH=/data/lantern.db
      # Hours before a service is marked 'stale' if no heartbeat is received (default: 24)
      - LANTERN_STALE_HOURS=${LANTERN_STALE_HOURS:-24}
      # Native Docker discovery: Lantern polls the Docker socket itself and
      # records a heartbeat per container, so no external push script is
      # needed. Active whenever the socket is mounted; set to false to disable.
      - LANTERN_DOCKER_DISCOVERY=${LANTERN_DOCKER_DISCOVERY:-true}
      # How often to poll the Docker daemon, in seconds (default: 60, floor: 10)
      - LANTERN_DOCKER_POLL_SECONDS=${LANTERN_DOCKER_POLL_SECONDS:-60}
      # Containers opt out of discovery with the label lantern.ignore=true
      # Webhook URLs for status change alerts (uncomment to enable):
      # - LANTERN_WEBHOOK_DISCORD=https://discord.com/api/webhooks/...
      # - LANTERN_WEBHOOK_TELEGRAM=https://api.telegram.org/bot<token>/sendMessage?chat_id=<id>
      # - LANTERN_WEBHOOK_GOTIFY=https://gotify.example.com/message?token=<appToken>
      # - LANTERN_WEBHOOK_GENERIC=https://your-domain.com/webhook

volumes:
  lantern_data:
